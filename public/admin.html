<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка заказов</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-wrap">
    <h1>Заказы</h1>
    <div class="admin-login">
      <input id="password" type="password" placeholder="Пароль админки" />
      <button id="loadBtn" class="primary-btn">Загрузить</button>
    </div>
    <div id="adminStatus" class="status">Введите пароль</div>
    <div id="orders"></div>
  </div>

  <script>
    const statusEl = document.getElementById('adminStatus');
    const ordersEl = document.getElementById('orders');
    const passwordEl = document.getElementById('password');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }

    function fmtMoney(v) {
      return new Intl.NumberFormat('ru-RU').format(v || 0) + ' ₽';
    }

    function fmtDate(v) {
      try { return new Date(v).toLocaleString('ru-RU'); } catch { return v; }
    }

    async function loadOrders() {
      const password = passwordEl.value.trim();
      statusEl.textContent = 'Загрузка…';
      ordersEl.innerHTML = '';

      const res = await fetch('/api/orders', { headers: { 'x-admin-password': password }, cache: 'no-store' });
      const data = await res.json();

      if (!data.ok) {
        statusEl.textContent = data.error || 'Ошибка';
        return;
      }

      statusEl.textContent = 'Заказов: ' + data.orders.length;

      ordersEl.innerHTML = data.orders.map(order => `
        <section class="order-card">
          <div class="order-head">
            <div>
              <strong>${escapeHtml(order.id)}</strong>
              <div class="subtle">${escapeHtml(fmtDate(order.createdAt))}</div>
            </div>
            <div class="order-totals">
              <strong>${escapeHtml(order.totalQuantity)} шт</strong>
              <div>${escapeHtml(fmtMoney(order.totalSum))}</div>
            </div>
          </div>
          <div class="subtle">Клиент: ${escapeHtml(order.customer || '—')}</div>
          <div class="subtle">Комментарий: ${escapeHtml(order.comment || '—')}</div>
          <table class="order-table">
            <thead><tr><th>Артикул</th><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr></thead>
            <tbody>
              ${order.items.map(item => `
                <tr>
                  <td>${escapeHtml(item.vendorCode || item.article || '—')}</td>
                  <td>${escapeHtml(item.name)}</td>
                  <td>${escapeHtml(item.quantity)}</td>
                  <td>${escapeHtml(fmtMoney(item.cartPrice ?? item.price))}</td>
                  <td>${escapeHtml(fmtMoney(item.sum))}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </section>
      `).join('');
    }

    document.getElementById('loadBtn').addEventListener('click', loadOrders);
  </script>
</body>
</html>
